name: 🧪 Agent 1 (早盘选股 & 企微直推 & 跟踪复盘)

on:
  workflow_dispatch: # 支持网页端手动点击运行
  schedule:
    # 北京时间 09:50 (UTC 时间 01:50) 周一至周五触发
    - cron: '50 1 * * 1-5'

# 🔒 开启仓库写权限，允许回写历史选股、跟踪池及复盘文件
permissions:
  contents: write

concurrency:
  group: morning-picker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 拉取代码 (完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 💡 关键：拉取完整历史，防止 git rebase 报错

      - name: 2. 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 执行选股与推送
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          MANUAL_TEST: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # 🟢 飞书多维表格环境变量
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python hedge_fund/strategies/morning_picker.py

      - name: 5. 自动提交并保存选股历史与复盘数据
        if: success() # 仅在选股推送成功后才提交数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 暂存需要保存的数据文件（支持根目录或策略目录）
          git add daily_picks_history.json portfolio_tracker.json skills_postmortem.md || true

          # 检查是否有文件改动，若有改动则提交并安全 Push
          if ! git diff --staged --quiet; then
            echo "发现数据更新，准备提交至 GitHub..."
            git commit -m "Auto-Update: 保存选股历史与建仓跟踪数据 [skip ci]"
            
            # 💡 强壮的 Git 拉取与变基合并逻辑，防止冲突中断
            git pull origin main --rebase || (git rebase --abort && git reset --hard origin/main && git pull origin main)
            
            git push origin HEAD:main
          else
            echo "没有任何文件变更，跳过提交。"
          fi
