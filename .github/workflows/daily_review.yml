name: Daily Quant Review Test

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'

# 【关键配置】显式声明 Git 仓库写权限
permissions:
  contents: write

concurrency:
  group: daily-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run Evening Review Test Script
        run: |
          python -c "
          from hedge_fund.portfolio.construction import PortfolioManager
          pm = PortfolioManager()
          test_prices = {'600519': 1600.0, '000001': 10.5}
          res = pm.run_evening_review(test_prices)
          print('=== 晚间复盘测试输出 ===')
          print(res)
          "

      - name: Commit and Push Updated Portfolio Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p data
          git add data/
          git commit -m "Auto-Update: Portfolio Data [skip ci]" || exit 0
          git push
