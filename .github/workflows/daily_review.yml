name: Daily Quant Evening Review

on:
  workflow_dispatch:
  schedule:
    # 转换 UTC：北京时间 15:30 (收盘后复盘) = UTC 07:30
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: daily-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Evening Review Script
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          python hedge_fund/strategies/evening_review.py

      - name: Commit and Push Updated Portfolio Data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hedge_fund/strategies/daily_picks_history.json || true
          git commit -m "Auto-Update: Portfolio Data [skip ci]" || exit 0
          git push
