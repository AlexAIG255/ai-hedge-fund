name: Daily Quant Morning & Evening Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1-5'   # 早上选股 (北京时间 09:00)
    - cron: '30 7 * * 1-5'  # 晚间复盘 (北京时间 15:30)

permissions:
  contents: write

jobs:
  morning-picker:
    name: Run Morning Stock Picker
    runs-on: ubuntu-latest
    # 定时触发早盘，或手动触发时运行
    if: github.event.schedule == '0 1 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install requests
      - name: Run Morning Picker
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: python hedge_fund/strategies/morning_picker.py

      # 修正：将根目录生成的选股历史与跟踪池提交到 Git 仓库
      - name: Commit and Push Pick History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_picks_history.json portfolio_tracker.json skills_postmortem.md || true
          git commit -m "Auto-save morning picks history [skip ci]" || exit 0
          git push

  evening-review:
    name: Run Evening Review
    runs-on: ubuntu-latest
    # 定时触发晚盘，或手动触发时运行
    if: github.event.schedule == '30 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install requests
      - name: Run Evening Review
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: python hedge_fund/strategies/evening_review.py

      # 补全：将晚盘复盘更新后的持仓跟踪与日志提交到 Git 仓库
      - name: Commit and Push Evening Review Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_picks_history.json portfolio_tracker.json skills_postmortem.md || true
          git commit -m "Auto-save evening review logs [skip ci]" || exit 0
          git push
