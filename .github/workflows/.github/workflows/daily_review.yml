name: Daily Quant Review Test

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击按钮一键测试
  schedule:
    - cron: '30 7 * * 1-5' # 北京时间每个交易日 15:30 (UTC 07:30) 自动触发

jobs:
  run-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run Evening Review Test Script
        run: |
          python -c "
          from hedge_fund.portfolio.construction import PortfolioManager
          pm = PortfolioManager()
          # 模拟行情测试数据
          test_prices = {'600519': 1600.0, '000001': 10.5}
          res = pm.run_evening_review(test_prices)
          print('=== 晚间复盘测试输出 ===')
          print(res)
          "

      - name: Commit and Push Updated Portfolio Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/portfolio.json
          git commit -m "Auto-Update: Portfolio Data [skip ci]" || exit 0
          git push
